services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: anipharm-postgres
    environment:
      POSTGRES_DB: anipharm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54321:5432"  # 호스트 포트 54321
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anipharm-network

  # Node.js 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anipharm-server
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: anipharm_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change_this_to_random_secret_key_in_production}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_random_refresh_secret_in_production}
      JWT_REFRESH_EXPIRES_IN: 30d
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anipharm-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  anipharm-network:
    driver: bridge

